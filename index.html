<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanvir Diouf · Portfolio</title>
    <!-- Font Awesome 6 (Free Icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ----- RESET & BASE ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
        }

        /* ----- MAIN CARD ----- */
        .card {
            max-width: 750px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 36px;
            padding: 50px 45px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            transition: transform 0.25s ease;
        }

        .card:hover {
            transform: translateY(-6px);
        }

        /* ----- AVATAR / INITIALS ----- */
        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 52px;
            font-weight: 700;
            margin: 0 auto 22px;
            color: #fff;
            border: 4px solid rgba(255, 255, 255, 0.15);
            user-select: none;
        }

        /* ----- TYPOGRAPHY ----- */
        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .tagline {
            font-size: 1.2rem;
            color: #b8b8d0;
            margin-bottom: 22px;
            padding-bottom: 22px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.07);
        }

        .bio {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #d4d4e8;
            margin-bottom: 32px;
        }

        /* ----- ACTION BUTTONS ----- */
        .actions {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .actions a {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            padding: 14px 32px;
            border-radius: 60px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .actions a i {
            font-size: 1.1rem;
        }

        .actions a:hover {
            background: #f5576c;
            border-color: #f5576c;
            transform: scale(1.04);
            box-shadow: 0 12px 28px rgba(245, 87, 108, 0.45);
        }

        /* ----- SOCIAL ICONS ----- */
        .socials {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 24px;
        }

        .socials a {
            color: #a0a0b8;
            font-size: 2rem;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .socials a:hover {
            color: #ffffff;
            transform: translateY(-4px) scale(1.1);
        }

        /* ----- RESPONSIVE (Mobile) ----- */
        @media (max-width: 550px) {
            .card {
                padding: 30px 20px;
            }
            h1 {
                font-size: 2.2rem;
            }
            .avatar {
                width: 100px;
                height: 100px;
                font-size: 40px;
            }
            .actions a {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Avatar (Change the emoji or replace it with an <img> tag) -->
        <div class="avatar">TD</div>

        <!-- Title -->
        <h1>Thanvir Diouf</h1>
        <p class="tagline">Developer · Creator · Problem Solver</p>

        <!-- Bio -->
        <p class="bio">
            Hello! I'm a passionate developer building useful things on the web. 
            Welcome to my digital space — feel free to explore my work or say hi! 🚀
        </p>

        <!-- Action Buttons -->
        <div class="actions">
            <a href="#"><i class="fas fa-folder-open"></i> View Projects</a>
            <a href="#"><i class="fas fa-envelope"></i> Contact</a>
        </div>

        <!-- Social Links -->
        <div class="socials">
            <a href="https://github.com/thanvirdiouf" target="_blank" aria-label="GitHub">
                <i class="fab fa-github"></i>
            </a>
            <a href="https://www.linkedin.com/in/thanvirdiouf" target="_blank" aria-label="LinkedIn">
                <i class="fab fa-linkedin-in"></i>
            </a>
            <a href="https://x.com/thanvirdiouf" target="_blank" aria-label="Twitter">
                <i class="fab fa-twitter"></i>
            </a>
            <a href="https://www.youtube.com/@thanvirdiouf" target="_blank" aria-label="YouTube">
                <i class="fab fa-youtube"></i>
            </a>
        </div>
    </div>

</body>
</html>
